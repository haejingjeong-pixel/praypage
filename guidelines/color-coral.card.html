<!-- @dsCard group="Colors" viewport="700x150" name="Brand Coral" subtitle="처방 코랄 — warm primary accent" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-body)}
  .wrap{padding:20px;display:flex;gap:10px}
  .sw{flex:1;height:96px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
  .sw b{font-size:12px;font-weight:700}
  .sw span{font-size:10.5px;opacity:.8}
  .lt{color:#5C544A}.dk{color:#FFF9F4}
</style></head>
<body><div class="wrap">
  <div class="sw lt" style="background:var(--coral-50)"><b>50</b><span>#FBEFE9</span></div>
  <div class="sw lt" style="background:var(--coral-100)"><b>100</b><span>#F7DDD1</span></div>
  <div class="sw lt" style="background:var(--coral-300)"><b>300</b><span>#EAA491</span></div>
  <div class="sw dk" style="background:var(--coral-500)"><b>500 · accent</b><span>#DF7A5F</span></div>
  <div class="sw dk" style="background:var(--coral-600)"><b>600 · hover</b><span>#C9634A</span></div>
  <div class="sw dk" style="background:var(--coral-700)"><b>700</b><span>#A94F39</span></div>
</div></body></html>
