<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4-based rhythm · sp-1 → sp-16" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-body)}
  .w{padding:22px;display:flex;gap:14px;align-items:flex-end}
  .c{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--coral-300);border-radius:4px;width:22px}
  .c span{font-size:10px;color:var(--text-muted)}
</style></head>
<body><div class="w">
  <div class="c"><div class="bar" style="height:4px"></div><span>4</span></div>
  <div class="c"><div class="bar" style="height:8px"></div><span>8</span></div>
  <div class="c"><div class="bar" style="height:12px"></div><span>12</span></div>
  <div class="c"><div class="bar" style="height:16px"></div><span>16</span></div>
  <div class="c"><div class="bar" style="height:20px"></div><span>20</span></div>
  <div class="c"><div class="bar" style="height:24px"></div><span>24</span></div>
  <div class="c"><div class="bar" style="height:32px"></div><span>32</span></div>
  <div class="c"><div class="bar" style="height:40px"></div><span>40</span></div>
  <div class="c"><div class="bar" style="height:48px"></div><span>48</span></div>
  <div class="c"><div class="bar" style="height:64px"></div><span>64</span></div>
</div></body></html>
