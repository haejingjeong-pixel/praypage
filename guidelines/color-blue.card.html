<!-- @dsCard group="Colors" viewport="700x150" name="Prescription Blue" subtitle="처방전 ink — linework & result CTA" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-body)}
  .wrap{padding:20px;display:flex;gap:10px}
  .sw{flex:1;height:96px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
  .sw b{font-size:12px;font-weight:700}
  .sw span{font-size:10.5px;opacity:.85}
  .lt{color:#2C4677}.dk{color:#F7FAFF}
</style></head>
<body><div class="wrap">
  <div class="sw lt" style="background:var(--rx-blue-100)"><b>100</b><span>#DCE6F2</span></div>
  <div class="sw dk" style="background:var(--rx-blue-300)"><b>300</b><span>#8FA9D0</span></div>
  <div class="sw dk" style="background:var(--rx-blue-500)"><b>500 · rx-ink</b><span>#3E63A6</span></div>
  <div class="sw dk" style="background:var(--rx-blue-700)"><b>700</b><span>#2C4677</span></div>
</div></body></html>
