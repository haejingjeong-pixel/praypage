<!-- @dsCard group="Colors" viewport="700x170" name="Paper & Ink" subtitle="Warm ivory surfaces + brown ink" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:#fff;font-family:var(--font-body)}
  .wrap{padding:20px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px}
  .sw{flex:1;height:60px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;border:1px solid rgba(0,0,0,.05)}
  .sw b{font-size:11px;font-weight:700}
  .sw span{font-size:10px;opacity:.7}
</style></head>
<body><div class="wrap">
  <div class="row">
    <div class="sw" style="background:var(--paper);color:#5C544A"><b>paper</b><span>#F3EEE9</span></div>
    <div class="sw" style="background:var(--paper-warm);color:#5C544A"><b>paper-warm</b><span>#EFEADF</span></div>
    <div class="sw" style="background:var(--cream);color:#5C544A"><b>cream · card</b><span>#FCF9F1</span></div>
    <div class="sw" style="background:var(--line-soft);color:#5C544A"><b>line-soft</b><span>#EAE2D4</span></div>
  </div>
  <div class="row">
    <div class="sw" style="background:var(--ink-900);color:#FCF9F1"><b>ink-900 · heading</b><span>#3E3730</span></div>
    <div class="sw" style="background:var(--ink-700);color:#FCF9F1"><b>ink-700 · body</b><span>#5C544A</span></div>
    <div class="sw" style="background:var(--ink-500);color:#FCF9F1"><b>ink-500 · muted</b><span>#8B8173</span></div>
    <div class="sw" style="background:var(--ink-300);color:#5C544A"><b>ink-300 · faint</b><span>#C4BBAC</span></div>
  </div>
</div></body></html>
