<script>
(function(){

<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script src="image-slot.js"></script>
<script src="assessment-data.js"></script>
<script src="rx-data.js"></script>
<script src="rx-prescriptions.js"></script>
<script src="rx-answer-mapping.js"></script>
<script src="rx-share-summaries.js"></script>
<script type="text/babel" src="MainScreen.standalone.jsx"></script>
<script type="text/babel" src="AssessmentScreen.standalone.jsx"></script>
<script type="text/babel" src="ResultScreen.jsx"></script>
<script type="text/babel" src="StickerScreen.jsx"></script>
<script type="text/babel">
  function readShared() {
    try {
      const h = window.location.hash.replace(/^#/, "");
      if (!h) return null;
      return JSON.parse(decodeURIComponent(escape(atob(h))));
    } catch (e) { return null; }
  }
  function App() {
    const shared = readShared();
    const [step, setStep] = React.useState(shared ? "sticker" : "main");
    const [mood, setMood] = React.useState(shared ? shared.mood : null);
    const [sharedStickers] = React.useState(shared ? shared.stickers || [] : []);
    const [rx, setRx] = React.useState(shared && shared.rx ? shared.rx : null);
    if (step === "main") {
      return <window.MainScreen selected={mood} onSelect={setMood} onNext={(k) => setStep("assessment")} />;
    }
    if (step === "assessment") {
      return <window.AssessmentScreen mood={mood} onBack={() => setStep("main")} onSubmit={(selections) => {
        const chosen = window.resolvePrescriptionByAssessment(mood, selections) || window.resolvePrescription(mood, selections, null);
        setRx(chosen); setStep("result");
      }} />;
    }
    if (step === "result") {
      return <window.ResultScreen mood={mood} rx={rx} onAgain={() => { setRx(null); setStep("main"); }} onDecorate={() => setStep("sticker")} />;
    }
    return step === "sticker" ? (
      <window.StickerScreen mood={mood} rx={rx} initialStickers={sharedStickers} onBack={() => setStep("result")} onNext={() => setStep("main")} />
    ) : null;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
