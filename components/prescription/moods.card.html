<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-body); }
  #root { padding: 40px 60px; }
  .row { display: flex; justify-content: space-between; margin-top: -2px; padding: 0 4px 30px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { MoodEnvelope, WoodShelf, MOODS } = window.DesignSystem_d4e5a3;
  function Demo() {
    const [sel, setSel] = React.useState("broken");
    const keys = Object.keys(MOODS);
    const rows = [keys.slice(0, 4), keys.slice(4, 8)];
    return (
      <div>
        {rows.map((row, i) => (
          <div key={i}>
            <WoodShelf />
            <div className="row">
              {row.map((k) => (
                <MoodEnvelope key={k} mood={k} width={150} selected={sel === k} onClick={() => setSel(k)} />
              ))}
            </div>
          </div>
        ))}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
