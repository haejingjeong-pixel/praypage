<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-body); }
  #root { padding: 26px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 78px; }
  .cell span.n { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Icon } = window.DesignSystem_d4e5a3;
  const names = ["waves","heart-crack","user","hourglass","heart-handshake","church","sprout","sunrise","calendar","heart-pulse","book-open","pill","triangle-alert","star","download","rotate-cw"];
  function Demo() {
    return (
      <div className="grid">
        {names.map((n) => (
          <div className="cell" key={n}>
            <Icon name={n} size={26} color="var(--rx-ink)" />
            <span className="n">{n}</span>
          </div>
        ))}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
